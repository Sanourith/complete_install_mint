# UPDATE NETWORK SPEED & CONFIG
################################################################################
- name: Verify tool installations
  ansible.builtin.apt:
    name:
      - iproute2
      - ethtool
    state: present
    update_cache: true
  become: true

- name: Auto-detect speed interface...
  ansible.builtin.shell:
    cmd: "ip -br link | awk '$1 ~ /^enp|^eth/ {print $1; exit}'"
  register: eth_iface
  changed_when: false

- name: Modifying speed properties...
  when: eth_iface.stdout != ""
  become: true
  block:
    - name: Reading last speed.
      ansible.builtin.shell:
        cmd: "ethtool {{ eth_iface.stdout }} | awk '/Speed:/{print $2}'"
      register: eth_speed
      changed_when: false

    - name: Force new target speed.
      ansible.builtin.command:
        ethtool -s {{ eth_iface.stdout }} speed {{ network_target_speed }} duplex full autoneg on
      when: eth_speed.stdout != (network_target_speed ~ "Mb/s")
      notify: Restart NetworkManager

    - name: Forcing deployment script...
      ansible.builtin.template:
        src: force-ethernet-speed.sh.j2
        dest: /usr/local/bin/force-ethernet-speed.sh
        mode: "0755"

    - name: Deploying associate systemd service...
      ansible.builtin.template:
        src: force-ethernet-speed.service.j2
        dest: /etc/systemd/system/force-ethernet-speed.service
        mode: "0644"
      notify: Activate new speed limit

- name: Warn if no ethernet interface was found...
  ansible.builtin.debug:
    msg: "No ethernet interface found (enp*/eth*) - ignored..."
  when: eth_iface.stdout == ""
################################################################################
